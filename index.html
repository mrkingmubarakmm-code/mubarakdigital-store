
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigitalStore | Digital Products</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0c1020;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #171e32;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #00e6a0;
    font-size: 23px;
    font-weight: bold;
}

.cart {
    background: #25304a;
    padding: 10px 15px;
    border-radius: 8px;
}

.hero {
    text-align: center;
    padding: 65px 15px;
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

.hero span {
    color: #00e6a0;
}

.hero p {
    color: #aab3c7;
    margin-top: 10px;
}

.products {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: #171e32;
    padding: 20px 12px;
    text-align: center;
    border-radius: 14px;
    border: 1px solid #29334a;
}

.emoji {
    font-size: 40px;
}

.card h3 {
    margin: 15px 0;
    font-size: 17px;
}

.price {
    color: #00e6a0;
    margin-bottom: 15px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #00e6a0;
    color: #07120f;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #8992a5;
}

@media (max-width: 350px) {
    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">DigitalStore</div>
    <div class="cart">
        🛒 Cart: <span id="count">0</span>
    </div>
</header>

<section class="hero">
    <h1>Welcome to <span>DigitalStore</span></h1>
    <p>Your Digital Products Marketplace</p>
</section>

<section class="products">

    <div class="card">
        <div class="emoji">🎮</div>
        <h3>Roblox Robux</h3>
        <div class="price">10,000 MMK</div>
        <button onclick="buy('Roblox Robux')">
            Buy Now
        </button>
    </div>

    <div class="card">
        <div class="emoji">🎁</div>
        <h3>Steam Wallet</h3>
        <div class="price">20,000 MMK</div>
        <button onclick="buy('Steam Wallet')">
            Buy Now
        </button>
    </div>

    <div class="card">
        <div class="emoji">💎</div>
        <h3>MLBB Diamonds</h3>
        <div class="price">15,000 MMK</div>
        <button onclick="buy('MLBB Diamonds')">
            Buy Now
        </button>
    </div>

    <div class="card">
        <div class="emoji">🔫</div>
        <h3>PUBG UC</h3>
        <div class="price">25,000 MMK</div>
        <button onclick="buy('PUBG UC')">
            Buy Now
        </button>
    </div>

</section>

<footer>
    DigitalStore © 2026
</footer>

<script>
let count = 0;

function buy(product) {
    count++;

    document.getElementById("count").innerText = count;

    alert(product + " selected!");
}
</script>

</body>
</html>
